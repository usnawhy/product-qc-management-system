spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qc_product?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password  # 请替换为你的MySQL密码
# 新增mybatis配置，开启驼峰映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.qc.qcsystem.entity
  configuration:
    map-underscore-to-camel-case: true

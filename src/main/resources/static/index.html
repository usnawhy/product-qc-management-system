<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品出厂质检记录管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px 45px;
            width: 380px;
        }
        .login-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 8px;
        }
        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #2a5298;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .login-btn:hover {
            opacity: 0.9;
        }
        .tip {
            margin-top: 18px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
        .msg {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }
        .msg.success { color: #28a745; }
        .msg.error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-title">产品出厂质检记录管理系统</div>
        <div class="login-subtitle">Quality Control Management System</div>
        <div class="form-group">
            <label>用户编号</label>
            <input type="text" id="userId" placeholder="请输入用户编号" value="admin">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" value="123456">
        </div>
        <button class="login-btn" onclick="doLogin()">登 录</button>
        <div class="msg" id="msg"></div>
        <div class="tip">默认账号：admin / 123456</div>
    </div>
    <script>
        function doLogin() {
            var userId = document.getElementById('userId').value.trim();
            var password = document.getElementById('password').value.trim();
            var msg = document.getElementById('msg');
            if (!userId || !password) {
                msg.className = 'msg error';
                msg.textContent = '请输入用户编号和密码';
                return;
            }
            msg.className = 'msg';
            msg.textContent = '登录中...';
            fetch('/login?userId=' + encodeURIComponent(userId) + '&password=' + encodeURIComponent(password))
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.code === 200 || data.code === 0 || data.success) {
                        msg.className = 'msg success';
                        msg.textContent = '登录成功，欢迎 ' + (data.data ? data.data.userName || userId : userId);
                    } else {
                        msg.className = 'msg error';
                        msg.textContent = data.msg || '登录失败，请检查账号密码';
                    }
                })
                .catch(function() {
                    msg.className = 'msg error';
                    msg.textContent = '网络错误，请稍后重试';
                });
        }
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
